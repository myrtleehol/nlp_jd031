[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myrtleehol-nlp_jd031"
version = "0.1.0"
description = "在同一个输入里两两比对，检测NLP 算法工程师·分块策略对召回的影响相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "myrtleehol" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://myrtleehol.github.io"
Repository = "https://github.com/myrtleehol/nlp_jd031"
Issues = "https://github.com/myrtleehol/nlp_jd031/issues"

[project.scripts]
nlp_jd031 = "nlp_jd031:main"

[tool.setuptools]
py-modules = ["nlp_jd031"]
